<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"><title>Prueba CORS ntfy</title></head>
<body style="font-family:monospace; background:#111; color:#eee; padding:16px">
<h3>Prueba de lectura cruzada a ntfy.sh (json y sse) desde este origen</h3>
<div id="log">probando…</div>
<script>
const log = document.getElementById('log');
const lines = [];
function say(s){ lines.push(s); log.innerHTML = lines.join('<br>'); }
const topic = 'bnv1-cors-probe-xyz';
(async () => {
  try {
    const r = await fetch('https://ntfy.sh/' + topic, { method: 'POST', body: JSON.stringify({ t: 'probe', mid: 'probe-1' }) });
    say('POST publicación: HTTP ' + r.status);
  } catch(e){ say('POST publicación: ERROR ' + e.message); }
  try {
    const r = await fetch('https://ntfy.sh/' + topic + '/json?poll=1&since=' + (Math.floor(Date.now()/1000) - 60), { cache: 'no-store' });
    const txt = await r.text();
    say('GET /json legible: HTTP ' + r.status + ' · contenido: ' + (txt.trim() ? txt.slice(0, 90) : '(vacío)'));
  } catch(e){ say('GET /json: ERROR ' + e.message); }
  try {
    const es = new EventSource('https://ntfy.sh/' + topic + '/sse');
    const to = setTimeout(() => { say('SSE: sin apertura en 9 s'); es.close(); }, 9000);
    es.onopen = () => { clearTimeout(to); say('SSE: ✅ abierto'); es.close(); };
    es.onerror = () => {};
  } catch(e){ say('SSE: ERROR ' + e.message); }
})();
</script>
</body></html>
